version: '3'

vars:
  BUF_VERSION: '1.53.0'
  PROTOC_GEN_GO_VERSION: 'v1.36.6'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.5.1'
  PROTOC_GEN_GRPC_GATEWAY_VERSION: 'v2.26.3'
  PROTOC_GEN_VALIDATE_VERSION: 'v1.2.1'
  MOCKERY_VERSION: 'v2.53.3'
  ENVSUBST_VERSION: 'v1.4.3'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  BUF: '{{.BIN_DIR}}/buf'
  PROTOC_GEN_GO: '{{.BIN_DIR}}/protoc-gen-go'
  PROTOC_GEN_GO_GRPC: '{{.BIN_DIR}}/protoc-gen-go-grpc'
  PROTOC_GEN_GRPC_GATEWAY: '{{.BIN_DIR}}/protoc-gen-grpc-gateway'
  PROTOC_GEN_VALIDATE: '{{.BIN_DIR}}/protoc-gen-validate'
  MOCKERY: "{{.BIN_DIR}}/mockery"
  ENVSUBST: '{{.BIN_DIR}}/envsubst'
  ENVDIR: '{{.ROOT_DIR}}/deploy/env'

  MODULES: ufo platform
  SERVICES: core,ufo

tasks:
  install-buf:
    desc: "Устанавливает Buf в каталог bin"
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}
        [ -f {{.BUF}} ] || {
          echo '📦 Устанавливаем buf {{.BUF_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/bufbuild/buf/cmd/buf@v{{.BUF_VERSION}}
        }
    status:
      - test -x {{.BUF}}
  
  proto:install-plugins:
    desc: "Устанавливает protoc плагины в каталог bin"
    cmds:
      - |
        [ -f {{.PROTOC_GEN_GO}} ] || {
          echo '📦 Installing protoc-gen-go...'
          GOBIN={{.BIN_DIR}} go install google.golang.org/protobuf/cmd/protoc-gen-go@{{.PROTOC_GEN_GO_VERSION}}
        }
        [ -f {{.PROTOC_GEN_GO_GRPC}} ] || {
          echo '📦 Installing protoc-gen-go-grpc...'
          GOBIN={{.BIN_DIR}} go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@{{.PROTOC_GEN_GO_GRPC_VERSION}}
        }
        [ -f {{.PROTOC_GEN_GRPC_GATEWAY}} ] || {
          echo '📦 Installing protoc-gen-grpc-gateway...'
          GOBIN={{.BIN_DIR}} go install github.com/grpc-ecosystem/grpc-gateway/v2/protoc-gen-grpc-gateway@{{.PROTOC_GEN_GRPC_GATEWAY_VERSION}}
        }
        [ -f {{.PROTOC_GEN_VALIDATE}} ] || {
          echo '📦 Installing protoc-gen-validate...'
          GOBIN={{.BIN_DIR}} go install github.com/envoyproxy/protoc-gen-validate@{{.PROTOC_GEN_VALIDATE_VERSION}}
        }

  proto:update-deps:
    deps: [ install-buf ]
    desc: Обновляет зависимости protobuf из удаленных репозиториев (googleapis и т.д.)
    dir: shared/proto
    cmds:
      - |
        echo "🔄 Обновляем зависимости buf..."
        {{.BUF}} dep update

  proto:lint:
    deps: [ install-buf, proto:install-plugins, proto:update-deps ]
    desc: Проверка .proto-файлов на соответствие стилю;
    dir: shared/proto
    cmds:
      - |
        echo "🔍 Проверяем .proto файлы..."
        {{.BUF}} lint

  proto:gen:
    deps: [ install-buf, proto:install-plugins, proto:update-deps, proto:lint ]
    desc: Генерация Go-кода из .proto
    dir: shared/proto
    cmds:
      - |
        echo "🏗️ Генерируем Go код из .proto..."
        {{.BUF}} generate

  gen:
    desc: "Генерирует код из всех спецификаций (proto + OpenAPI)"
    cmds:
      - task: proto:gen

  mockery:install:
    desc: "Устанавливает mockery в ./bin"
    cmds:
      - |
        [ -f {{.MOCKERY}} ] || {
          echo '📦 Installing mockery...'
          GOBIN={{.BIN_DIR}} go install github.com/vektra/mockery/v2@{{.MOCKERY_VERSION}}
        }
    status:
      - test -x {{.MOCKERY}}

  mockery:gen:
    desc: "Генерирует моки интерфейсов с помощью mockery"
    deps: [ mockery:install ]
    cmds:
      - |
        echo '🧪 Генерация моков...'
        {{.MOCKERY}}

  up-core:
    desc: Поднять core контейнеры
    dir: deploy/compose/core
    cmds:
      - echo "[task] 🚀 Поднимаем core контейнеры"
      - docker compose up --build --detach

  down-core:
    desc: Остановить и удалить core контейнеры
    dir: deploy/compose/core
    cmds:
      - echo "[task] 🛑 Останавливаем core контейнеры"
      - docker compose down --volumes

  up-ufo:
    desc: Поднять UFO сервис и все его зависимости
    dir: deploy/compose/ufo
    cmds:
      - echo "[task] 📦 Поднимаем UFO сервис с зависимостями"
      - docker compose up --build --detach

  down-ufo:
    desc: Остановить и удалить UFO сервис и все его зависимости
    dir: deploy/compose/ufo
    cmds:
      - echo "[task] 🛑 Останавливаем UFO сервис с зависимостями"
      - docker compose down --volumes

  up-all:
    desc: Поднять все сервисы по очереди вместе с зависимостями
    cmds:
      - task up-core
      - task up-ufo

  down-all:
    desc: Остановить и удалить все сервисы по очереди вместе с зависимостями
    cmds:
      - task down-core
      - task down-ufo

  env:install-envsubst:
    desc: "Устанавливает envsubst в bin/"
    cmds:
      - |
        [ -f {{.ENVSUBST}} ] || {
          echo "📦 Устанавливаем envsubst версии {{.ENVSUBST_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/a8m/envsubst/cmd/envsubst@{{.ENVSUBST_VERSION}}
        }
        echo "✅ envsubst установлен: {{.ENVSUBST}}"

  env:generate:
    desc: "Генерирует .env файлы для всех сервисов из шаблонов и единого файла конфигурации"
    deps: [ env:install-envsubst ]
    cmds:
      - |
        ENV_FILE="{{.ENVDIR}}/.env"
        TEMPLATE_FILE="{{.ENVDIR}}/.env.template"
        SCRIPT="{{.ENVDIR}}/generate-env.sh"
        
        if [ ! -f "$ENV_FILE" ]; then
          if [ -f "$TEMPLATE_FILE" ]; then
            echo "🔄 Файл $ENV_FILE не найден, создаем из шаблона $TEMPLATE_FILE"
            cp "$TEMPLATE_FILE" "$ENV_FILE"
            echo "✅ Создан файл $ENV_FILE. Проверьте и отредактируйте значения переменных при необходимости."
          else
            echo "❌ Шаблон $TEMPLATE_FILE не найден!"
            exit 1
          fi
        fi
        
        chmod +x "$SCRIPT"
        # Передаем список сервисов в виде строки с разделителями-запятыми
        export SERVICES="{{.SERVICES}}"
        ENV_SUBST={{.ENVSUBST}} "$SCRIPT"
